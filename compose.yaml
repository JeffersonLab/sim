services:
  oracle:
    extends:
      file: deps.yaml
      service: oracle

  keycloak:
    extends:
      file: deps.yaml
      service: keycloak

  puppet:
    extends:
      file: deps.yaml
      service: puppet

  mailhog:
    extends:
      file: deps.yaml
      service: mailhog

  sync-stand-in:
    image: nginx:1.27.5-alpine
    hostname: sync-stand-in
    volumes:
      - ./container/sync-stand-in/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./container/sync-stand-in/www:/usr/share/nginx/html:ro

  sim:
    hostname: sim
    user: dev
    ports:
      # Wildfly listens for HTTPS on the host's port, so its redirects to HTTPS (such as /sso's) reach it
      - "127.0.0.1:${SIM_HTTPS_PORT:-8443}:${SIM_HTTPS_PORT:-8443}"
      - "127.0.0.1:${SIM_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${SIM_MANAGEMENT_PORT:-9990}:9990"
    environment:
      # The browser reaches Keycloak and the app on the host's ports
      KEYCLOAK_FRONTEND_SERVER_URL: 'http://localhost:${SIM_KEYCLOAK_PORT:-8081}/auth'
      FRONTEND_SERVER_URL: 'https://localhost:${SIM_HTTPS_PORT:-8443}'
      PREPEND_JAVA_OPTS: '-Djboss.https.port=${SIM_HTTPS_PORT:-8443}'
      # The sync pages read the stand-in, not GitHub, GitLab or JLab's servers
      SYNC_GITHUB_URL: 'http://sync-stand-in/github'
      SYNC_GITLAB_URL: 'http://sync-stand-in/gitlab'
      SYNC_CSUE_URL: 'http://sync-stand-in/csue'
      SYNC_CERTIFIED_URL: 'http://sync-stand-in/certified'
      SYNC_LLAPP_URL: 'http://sync-stand-in/llapp'
    depends_on:
      # The app reads its settings from Oracle as it deploys, and a login before Keycloak's
      # setup finishes gets a session without the user's roles
      oracle:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      sync-stand-in:
        condition: service_started
