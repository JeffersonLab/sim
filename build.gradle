import com.github.spotbugs.snom.SpotBugsTask

plugins {
    id 'war'
    id "com.diffplug.spotless" version "7.2.1"
    id 'pmd'
    id 'com.github.spotbugs' version '6.5.6'
}
description = 'Application Registry Manager app'
group = 'org.jlab'
version = new File("${projectDir}/VERSION").text.trim()
ext.version = project.version
ext.smoothnessVersion = '5.0.2'
ext.releaseDate = new Date().format('MMM dd yyyy')

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
    options.compilerArgs += ["-Xlint:deprecation", "-Xlint:unchecked"]
}
sourceSets {
    integration {
        java.srcDir "${projectDir}/src/integration/java"
    }
}
configurations {
    integrationImplementation.extendsFrom testImplementation
    integrationRuntimeOnly.extendsFrom testRuntimeOnly
}
repositories {
    mavenCentral()
}
dependencies {
    // No matter what smoothness weblib MUST be included in WAR (https://github.com/JeffersonLab/smoothness/issues/4)
    implementation "org.jlab:smoothness-weblib:${smoothnessVersion}"

    // Latest Wildfly no longer includes...
    implementation 'org.jsoup:jsoup:1.21.2'

    // Smoothness setup should install these into Wildfly
    providedCompile 'org.tuckey:urlrewritefilter:5.1.3'

    // Wildfly 37.0.1.Final provides:
    providedCompile 'jakarta.platform:jakarta.jakartaee-api:10.0.0',
                    'org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1',
                    'org.hibernate:hibernate-core:6.6.19.Final'

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Wildfly provides JSON-P to the app; the tests need an implementation
    testImplementation 'org.eclipse.parsson:parsson:1.1.9'

    integrationImplementation 'org.jsoup:jsoup:1.21.2'
}
tasks.named('test') {
    useJUnitPlatform()
}
tasks.register('integrationTest', Test) {
    description = 'Runs integration tests against a running app (docker compose -f build.yaml up).'
    group = 'verification'

    testClassesDirs = sourceSets.integration.output.classesDirs
    classpath = sourceSets.integration.runtimeClasspath

    useJUnitPlatform()
    shouldRunAfter tasks.named('test')

    // The services may still be starting, and they are not up to date with the source files
    outputs.upToDateWhen { false }

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat = "full"
    }
}
tasks.named('jar') {
    enabled = false
}
war {
    archiveFileName = 'sim.war'
    filesMatching('WEB-INF/web.xml') {
        filter {
            String line -> line.replaceAll("@VERSION@", version)
        }
        filter {
            String line -> line.replaceAll("@RELEASE_DATE@", releaseDate)
        }
        filter {
            String line -> line.replaceAll("@SMOOTHNESS_VERSION@", smoothnessVersion)
        }
    }
}
spotless {
    java {
        googleJavaFormat()
    }
}
pmd {
    // Pinned, so that a Gradle upgrade doesn't change the rules the build enforces
    toolVersion = '7.13.0'
    // The app's code; its rules for tests, such as one assertion per test, don't suit these tests
    sourceSets = [sourceSets.main]
    consoleOutput = true
    ruleSets = [
            "category/java/errorprone.xml",
            "category/java/bestpractices.xml",
            "category/java/security.xml"
    ]

    // category/java/codestyle.xml
    // category/java/performance.xml
    // category/java/multithreading.xml
    // category/java/design.xml
}
spotbugs {
    excludeFilter = file("spotbugs-exclude.xml")
    showProgress = true

    // Allows the build to proceed to custom conditional throw
    ignoreFailures = true
}
tasks.spotbugsMain {
    reports.create("html") {
        required = true
        outputLocation = file("$buildDir/reports/spotbugs.html")
        stylesheet = "fancy-hist.xsl"
    }
    reports.create("text") {
        required = true
        outputLocation = file("$buildDir/reports/spotbugs.text")
    }
}
// Like PMD, SpotBugs checks the app's code, not the tests
['spotbugsTest', 'spotbugsIntegration'].each { name ->
    tasks.named(name) {
        enabled = false
    }
}
tasks.withType(SpotBugsTask).configureEach {
    doLast {
        def reportFile = reports.text.outputLocation.asFile.get()
        if (reportFile.exists() && reportFile.length() > 0) {
            logger.lifecycle("\n[SpotBugs Console Stream]\n" + reportFile.text)
            // Manually break the build here so fails AFTER logging to stdout for CI
            throw new GradleException("SpotBugs violations found. Check the console log above.")
        }
    }
}