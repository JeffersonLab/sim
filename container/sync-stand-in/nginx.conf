# A stand-in for the sources that the sync pages read (SyncService), so a Compose stack's syncs
# get known data and never reach GitHub, GitLab or JLab's servers. compose.yaml points the app at
# it with the SYNC_*_URL variables. The integration tests (SyncIT) expect this data.
server {
    listen 80;
    root /usr/share/nginx/html;

    # GitHub's repository search, in two pages linked like GitHub's pagination
    location = /github {
        add_header Link '<http://$http_host/github-2>; rel="next"';
        try_files /github-1.json =404;
    }

    location = /github-2 {
        try_files /github-2.json =404;
    }

    # GitLab's group projects
    location = /gitlab {
        try_files /gitlab.json =404;
    }

    # The CSUE apps page
    location = /csue {
        try_files /csue.html =404;
    }

    # The Certified Software list, a page for each type: app, lib or script
    location = /certified {
        try_files /certified-$arg_type.html =404;
    }

    # The Low Level Apps directory listing
    location = /llapp {
        try_files /llapp.txt =404;
    }
}
